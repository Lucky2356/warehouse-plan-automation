name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Сборка и тесты
    runs-on: windows-latest

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v7

      - name: Установка .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Восстановление пакетов
        run: dotnet restore WarehousePlanAutomation.sln

      - name: Сборка
        run: dotnet build WarehousePlanAutomation.sln --configuration Release --no-restore

      - name: Тесты
        run: dotnet test WarehousePlanAutomation.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory artifacts/test-results

      - name: Публикация результатов тестов
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: ignore
